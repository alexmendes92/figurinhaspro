name: Quality Gate
on:
  pull_request:
  push:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` em Linux não baixa optionalDependencies binárias quando o
      # package-lock.json foi gerado em outra plataforma (Windows/macOS).
      # Bug conhecido em npm 7+ (https://github.com/npm/cli/issues/4828) —
      # afeta lightningcss (Tailwind 4) e @tailwindcss/oxide. Workaround:
      # forçar instalação dos opcionais.
      - run: npm ci --include=optional
      - run: npm run build
