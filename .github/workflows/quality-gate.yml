name: Quality Gate
on:
  pull_request:
  push:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Usa `npm install` em vez de `npm ci` porque o lockfile pode ter sido
      # gerado em Windows/macOS e o npm 7+ não baixa optionalDependencies
      # binárias cross-plataforma (https://github.com/npm/cli/issues/4828).
      # Sem isso, lightningcss (Tailwind 4) e @tailwindcss/oxide falham em
      # Linux com "Cannot find module ../lightningcss.linux-x64-gnu.node".
      # `npm install` re-resolve opcionais na plataforma alvo.
      - run: npm install --no-audit --no-fund
      - run: npm run build
