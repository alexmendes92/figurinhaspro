name: Quality Gate
on:
  pull_request:
  push:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bug npm 7+ com optionalDependencies cross-plataforma
      # (https://github.com/npm/cli/issues/4828): se package-lock.json
      # foi gerado em Windows/macOS, npm ci em Linux NÃO baixa os
      # binários .node corretos (lightningcss-linux-x64-gnu etc).
      # Workaround: descartar lockfile e forçar resolução fresca.
      - name: Install (sem lockfile p/ resolver opcionais Linux)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      # Gate cobre correção (tipos + testes). Build completo é validado
      # pelo deploy preview do Vercel com env vars reais — evita ter que
      # passar dummies de DATABASE_URL/SESSION_SECRET aqui e tropeçar em
      # prerender SSG de páginas admin que tentam acessar DB em build.
      - run: npx tsc --noEmit
      - run: npm run test
